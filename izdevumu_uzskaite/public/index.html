<!DOCTYPE html>
<html lang="lv">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Izdevumu uzskaite</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>

    <body>
        <h1>Izdevumu uzskaite</h1>
        <p>Mana izdevumu uzskaites sistēma</p>

        <form id="izmaksu-form">
            <label for="description">Apraksts: </label>
            <input type="text" id="description" required>

            <label for="amount">Summa (eur): </label>
            <input tpe="number" id="amount" min="0.01" step="0.01" required>

            <label for="category">Kategorija: </label>
            <select id="category">
                <option value="Pārtika">Pārtika</option>
                <option value="Transports">Transports</option>
                <option value="Izklaide">Izklaide</option>
                <option value="Cits">Cits</option>
            </select>

            <label for="date">Datums: </label>
            <input type="date" id="date" required>

            <button type="submit">Pievienot</button>
        </form>

        <h2>Mani izdevumi</h2>
        <ul id="expense-list"></ul>

        <h3>Kopā: <span id="total">0.00</span> eur</h3>
    </body>
</html>
